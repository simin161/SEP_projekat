spring:
  application:
    name: crypto-plugin
  datasource:
    url: jdbc:postgresql://${CRYPTO_DB_HOST:localhost}:${CRYPTO_DB_PORT:5432}/crypto_db
    username: ${CRYPTO_DB_USER:crypto_user}
    password: ${CRYPTO_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8085}
  ssl:
    enabled: true
    enabled-protocols: TLSv1.3
    key-store: ${SSL_KEY_STORE:}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    client-auth: ${SSL_CLIENT_AUTH:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

sep:
  kafka:
    attempt-results-topic: psp.attempt-results
  crypto:
    rpc-url: ${CRYPTO_RPC_URL:}
