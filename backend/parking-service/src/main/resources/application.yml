spring:
  application:
    name: parking-service
  datasource:
    url: jdbc:postgresql://${PARKING_DB_HOST:localhost}:${PARKING_DB_PORT:5432}/parking_db
    username: ${PARKING_DB_USER:parking_user}
    password: ${PARKING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

server:
  port: ${SERVER_PORT:8081}
  ssl:
    enabled: true
    enabled-protocols: TLSv1.3
    key-store: ${SSL_KEY_STORE:}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    client-auth: ${SSL_CLIENT_AUTH:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

sep:
  psp-client:
    base-url: ${PSP_BASE_URL:https://localhost:8082}
    merchant-id: ${PSP_MERCHANT_ID:}
    api-secret: ${PSP_API_SECRET:}
    webhook-secret: ${PSP_WEBHOOK_SECRET:}
